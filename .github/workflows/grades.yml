name: Daily Grade Update

on:
  push:
    branches:
      - main

  schedule:
    # ⚠️ FIXED: GitHub Actions does not support the 'timezone' key. 
    # Crons always run in UTC. 1:20 AM PDT is 8:20 AM UTC.
    - cron: "20 8 * * *"

  workflow_dispatch:

jobs:
  grades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests flask pandas flask_sqlalchemy sqlalchemy.orm

      - name: Run grade updater
        env:
          TOKEN: ${{ secrets.TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          PASS: ${{ secrets.PASS }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Force git to see db, even if file is specified in .gitignore
          git add -f instance/grades.db
          
          # Commit the changes or exit cleanly if there's no new data
          git commit -m "Automated database update [skip ci]" || echo "No changes to commit"
          git push
