
name: Daily Grade Update

on:
  push:
    branches:
      - main

  schedule:
    - cron: "20 1 * * *"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  grades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests sqlalchemy flask flask_sqlalchemy pandas

      - name: Run grade updater
        env:
          TOKEN: ${{ secrets.TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          PASS: ${{ secrets.PASS }}
        run: python main.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add instance/grades.db

          if ! git diff --cached --quiet; then
            git commit -m "Update grade database"
            git push origin HEAD:main
          else
            echo "No database changes to commit."
          fi
